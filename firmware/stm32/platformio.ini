; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build fuori dal repo: il percorso del progetto contiene spazi ("PROGETTI GITHUB")
; e il flusso Zephyr di PlatformIO non li digerisce (dts preprocess + nodi SCons).
; Compilare passando dalla junction senza spazi: C:\Users\pinco\J5\firmware\stm32
workspace_dir = C:/Users/pinco/.j5pio

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = zephyr
; Serial monitor: deve essere 115200 (come USART2 in zephyr/overlays/uart.overlay). Se vedi caratteri strani, verifica che il monitor usi 115200.
monitor_speed = 115200
board_build.zephyr.overlays = zephyr/overlays/uart.overlay zephyr/overlays/i2c.overlay zephyr/overlays/pwm.overlay zephyr/overlays/gpio_button.overlay zephyr/overlays/rt_timer.overlay

; JONNY5 SHIELD rev3 — WeAct STM32G474CEU6 (board Zephyr nucleo_g474re, stesso MCU).
; Console Zephyr su USART1 (J10 -> VCP ST-Link, COM8). Control-plane Pi su USART3.
[env:weact_g474_shield]
platform = ststm32
board = nucleo_g474re
framework = zephyr
; Usa lo Zephyr GIA' installato (stesso dell'env F446/Cursor) invece di scaricare l'update
platform_packages = platformio/framework-zephyr @ 3.40201.251021
upload_protocol = stlink
monitor_speed = 115200
