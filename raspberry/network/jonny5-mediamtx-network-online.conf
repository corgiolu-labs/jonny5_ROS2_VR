# systemd drop-in for jonny5-mediamtx: start only when NetworkManager reports the network online,
# so WebRTC ICE candidates include eth0/wlan0 (gathered once at startup). Installed by raspberry/setup_pi.sh
# to /etc/systemd/system/jonny5-mediamtx.service.d/10-network-online.conf
[Unit]
After=network-online.target NetworkManager-wait-online.service
Wants=network-online.target

[Service]
ExecStartPre=-/usr/bin/nm-online -q --timeout=30
