# MediaMTX — configurazione unica low-latency JONNY5 (dual camera 800x450, 120 FPS).
# Path: config_runtime/video/mediamtx.yml (accanto a video_pipeline.yaml).
# Caricata da scripts/start_mediamtx.sh quando video_pipeline: webrtc.

logLevel: info
writeQueueSize: 64
readTimeout: 5s
writeTimeout: 5s

rtsp: true
rtspAddress: :8554
webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcLocalUDPAddress: ":8189"
# ICE candidates are gathered at startup: after a reboot MediaMTX can start before eth0/wlan0
# have an address and then advertises only 127.0.0.1 (WebRTC "deadline exceeded while waiting
# connection" in the dashboard/viewer). Always advertise the robot addresses explicitly.
webrtcAdditionalHosts: [10.42.0.1, 192.168.137.221]
# Video is UDP-only: no RTSP interleaved-TCP sessions, no WebRTC ICE-TCP fallback.
rtspTransports: [udp]
webrtcHandshakeTimeout: 5s
webrtcTrackGatherTimeout: 2s

paths:
  cam0:
    source: rpiCamera
    rpiCameraCamID: 0
    rpiCameraWidth: 800
    rpiCameraHeight: 450
    rpiCameraFPS: 120
    rpiCameraCodec: auto
    rpiCameraDenoise: "off"
    rpiCameraIDRPeriod: 20
    rpiCameraBitrate: 3000000
    rpiCameraAfMode: continuous
    rpiCameraAfRange: normal
  cam1:
    source: rpiCamera
    rpiCameraCamID: 1
    rpiCameraWidth: 800
    rpiCameraHeight: 450
    rpiCameraFPS: 120
    rpiCameraCodec: auto
    rpiCameraDenoise: "off"
    rpiCameraIDRPeriod: 20
    rpiCameraBitrate: 3000000
    rpiCameraAfMode: continuous
    rpiCameraAfRange: normal
