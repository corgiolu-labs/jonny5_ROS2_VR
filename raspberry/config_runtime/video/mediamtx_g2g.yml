# MediaMTX — config di TEST per la misura glass-to-glass WebRTC (Idea 1, Stadio 3).
# NON ha rpiCamera: la camera CSI è usata dal publisher stamped_h264_source.py.
# Il path cam_g2g accetta un publisher RTSP (ffmpeg libx264 timbrato) e lo serve in
# WebRTC/WHEP sulle stesse porte della produzione (così il proxy /api/webrtc-whep va).
# Va avviato SOLO dopo aver fermato jonny5-mediamtx (porte 8889/8554/8189 condivise).
logLevel: error
readTimeout: 10s
writeTimeout: 10s

rtsp: yes
rtspAddress: :8554

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcLocalUDPAddress: ":8189"
# ICE candidates are gathered at startup: after a reboot MediaMTX can start before eth0/wlan0
# have an address and then advertises only 127.0.0.1 (WebRTC "deadline exceeded while waiting
# connection" in the dashboard/viewer). Always advertise the robot addresses explicitly.
webrtcAdditionalHosts: [10.42.0.1, 192.168.137.221]
# Video is UDP-only: no RTSP interleaved-TCP sessions, no WebRTC ICE-TCP fallback.
rtspTransports: [udp]
webrtcHandshakeTimeout: 5s
webrtcTrackGatherTimeout: 2s

paths:
  cam_g2g:
