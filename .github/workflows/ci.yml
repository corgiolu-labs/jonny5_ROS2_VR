name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Firmware (Zephyr, G474)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi ninja-build device-tree-compiler
          pip install west pyelftools pyyaml jsonschema packaging
      - uses: actions/cache@v4
        with:
          path: ~/.cache/j5-zephyr
          key: zephyr-v4.2.1-stm32-${{ hashFiles('firmware/stm32/tools/build_zephyr.sh') }}
      - name: Build nucleo_g474re
        run: firmware/stm32/tools/build_zephyr.sh

  sim:
    name: Firmware simulator + j5mini (real firmware sources on the host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependencies
        run: pip install pytest websockets
      - name: Tests (fw_sim, differential vs the original firmware, j5mini)
        working-directory: firmware/stm32
        run: |
          git fetch --depth=1 origin 22b6a46
          mkdir -p /tmp/orig && git -C ../.. archive 22b6a46 firmware/stm32/src | tar -x -C /tmp/orig
          FW_SIM_ORIG_SRC=/tmp/orig/firmware/stm32/src python -m pytest tools/fw_sim ../../minimal/j5mini -q
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
