# JONNY5 ROS2 runtime parameters (native stack — see ADR-001).

jonny5_spi_driver:
  ros__parameters:
    # Dry-run default. Set use_mock_spi:=false on the real Raspberry Pi.
    use_mock_spi: true
    spi_device: "/dev/spidev0.0"
    spi_speed_hz: 1000000
    tx_rate_hz: 100.0
    # SPI protocol: 1 = legacy (any firmware); 2 = CRC-16 + TELEMETRY_V2 +
    # J5IK joint streaming (flash the v2 firmware first, see docs/SPI_PROTOCOL_V2.md).
    protocol_version: 1
    # Rate of interleaved 0x03 STATUS requests to read the firmware diag
    # (deadman/armed/freeze/guard). 0 disables (telemetry-only).
    status_request_hz: 5.0
    # Path to the dir containing the legacy 'controller' package.
    # Empty = auto-resolve (env JONNY5_LEGACY_ROOT, repo walk-up, Pi fallback).
    legacy_root: ""
    # Stale-intent watchdog: without a TeleopIntent for this long the driver
    # streams IDLE frames (no buttons -> firmware deadman released). 0 disables.
    intent_timeout_s: 0.25
    # Servo calibration (B S G Y P R), must match
    # raspberry/config_runtime/robot/j5_settings.json "offsets" / "dirs".
    # joint_rad = radians((physical_deg - offset) * dir); 0 rad = HOME.
    servo_offsets_deg: [100.0, 88.0, 93.0, 95.0, 90.0, 95.0]
    servo_dirs: [1, -1, 1, 1, -1, 1]
    joint_names:
      - base_joint
      - shoulder_joint
      - elbow_joint
      - wrist_yaw_joint
      - wrist_pitch_joint
      - wrist_roll_joint

jonny5_vr_bridge:
  ros__parameters:
    bind_host: "0.0.0.0"
    bind_port: 8567
